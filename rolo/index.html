<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rolo de bordados</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="../assets/typography.css" />
    <link rel="stylesheet" href="../assets/navigation.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="../assets/navigation.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body class="page-rolo">
    <nav class="site-navigation" aria-label="Navegação da página">
      <a class="site-navigation__link" href="../index.html" data-site-back
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="m10 5-7 7 7 7M3 12h18" /></svg
        >Voltar</a
      >
      <a class="site-navigation__link" href="../index.html" aria-label="Voltar à página inicial"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z" /></svg
        >Página inicial</a
      >
    </nav>
    <div id="root">
      <main class="journey branch-closed">
        <div class="horizontal-sequence">
          <div class="experience is-locked">
            <section
              class="horizontal-track"
              tabindex="-1"
              aria-label="Rolo de tecido com oito bordados. Role para o lado ou use as setas para explorar."
              aria-describedby="journey-hint"
            >
              <div class="stage">
                <div class="cloth" aria-hidden="true">
                  <div class="selvedge selvedge-top"></div>
                  <div class="selvedge selvedge-bottom"></div>
                  <div class="embroideries"></div>
                </div>
                <button class="roll" type="button" aria-label="Abrir o rolo de tecido">
                  <img
                    class="roll-image"
                    src="./assets/fabric-roll-cylinder-intact.svg"
                    alt=""
                    draggable="false"
                    fetchpriority="high"
                  />
                </button>
              </div>
            </section>
            <p id="journey-hint" class="journey-hint" aria-live="polite">
              Clique no rolo para começar
            </p>
          </div>
        </div>
      </main>
    </div>
    <template id="vertical-scenes"
      ><section id="vertical-installation" class="vertical-installation">
        <main class="installation" aria-label="Instalação têxtil">
          <div class="beaded-cord" aria-hidden="true"></div>
          <div class="beaded-cord beaded-cord-tail" aria-hidden="true"></div>

          <section
            class="scene scene-opening"
            aria-label="Uma corda de miçangas vermelhas desce pelo centro da tela"
          >
            <h1 class="visually-hidden">Instalação têxtil</h1>
          </section>

          <section class="scene scene-left" aria-label="Primeiro bordado, à esquerda da corda">
            <img
              class="vertical-embroidery"
              src="./assets/installation/image-02.jpeg"
              width="1313"
              height="1395"
              alt="Obra têxtil com uma figura em tecido preto, linhas vermelhas e uma moldura de renda branca."
              decoding="async"
              draggable="false"
            />
          </section>

          <section class="scene scene-right" aria-label="Segundo bordado, à direita da corda">
            <img
              class="vertical-embroidery"
              src="./assets/installation/image-03.jpeg"
              width="1326"
              height="1443"
              alt="Obra têxtil com um torso em tecido preto, fios vermelhos e uma moldura de renda branca."
              decoding="async"
              draggable="false"
            />
          </section>

          <section class="scene scene-heart" aria-label="Um coração suspenso na corda">
            <div class="heart-frame">
              <img
                class="heart-photo"
                src="./assets/installation/image-04.jpeg"
                width="1024"
                height="855"
                alt="Coração de renda branca preso à corda de miçangas, com as palavras WILL YOU STOP? em vermelho."
                decoding="async"
                draggable="false"
              />
            </div>
          </section>

          <section class="scene scene-lace" aria-label="Última obra: calcinha bordada">
            <img
              class="lace-art"
              src="./assets/installation/image-05.webp"
              width="1149"
              height="1369"
              alt="Calcinha de renda branca com bordados de miçangas vermelhas e roxas e uma ponta de corda vermelha pendurada."
              decoding="async"
              draggable="false"
            />
          </section>
        </main></section></template
    ><noscript>Ative o JavaScript para explorar o rolo.</noscript>
  </body>
</html>
