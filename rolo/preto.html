<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Preto — Experimentos</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    main {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .final-switch {
      position: relative;
      width: min(400px, 92vw, 84svh);
      aspect-ratio: 1290 / 1650;
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .final-switch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: sepia(.85) saturate(4.2) hue-rotate(316deg) brightness(.58) contrast(1.15);
    }
    .final-switch .switch-key {
      position: absolute;
      inset: 0;
      transform: scaleY(-1);
      transform-origin: 50% 44.15152%;
    }
  </style>
</head>
<body>
  <main aria-label="Tela preta com o interruptor desligado">
    <div class="final-switch" aria-hidden="true">
      <img src="./assets/interruptor-moldura.svg" width="1290" height="1650" alt="" draggable="false">
      <img class="switch-key" src="./assets/interruptor-tecla.svg" width="1290" height="1650" alt="" draggable="false">
    </div>
  </main>
</body>
</html>
