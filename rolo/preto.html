<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Preto — Experimentos</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overscroll-behavior: contain;
    }
    body {
      min-width: 100%;
      min-height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }
    main {
      --overscan-x: 16vw;
      --overscan-y: 18dvh;
      position: relative;
      width: calc(100vw + 2 * var(--overscan-x));
      height: calc(100dvh + 2 * var(--overscan-y));
      min-width: 100%;
      min-height: 100%;
      background: #000;
    }
    .final-switch {
      position: absolute;
      left: calc(var(--overscan-x) + var(--switch-cx, 50vw));
      top: calc(var(--overscan-y) + var(--switch-cy, 50vh));
      transform: translate(-50%, -50%);
      width: min(320px, 73.6vw, 67.2svh);
      aspect-ratio: 1235 / 1583;
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .final-switch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .final-switch .switch-key {
      position: absolute;
      inset: 0;
      transform: translateY(2.5%) scaleY(-1);
      transform-origin: 50% 44.15152%;
    }
  </style>
</head>
<body>
  <main aria-label="Tela preta com o interruptor desligado">
    <div class="final-switch" aria-hidden="true">
      <img src="./assets/interruptor-moldura.webp" width="1235" height="1583" alt="" draggable="false">
      <img class="switch-key" src="./assets/interruptor-tecla.webp" width="1235" height="1583" alt="" draggable="false">
    </div>
  </main>
  <script>
    history.scrollRestoration = 'manual';
    const params = new URLSearchParams(window.location.search);
    const cx = Number(params.get('cx'));
    const cy = Number(params.get('cy'));
    const root = document.documentElement;
    const viewport = window.visualViewport;

    if (Number.isFinite(cx)) {
      root.style.setProperty('--switch-cx', `${cx + (viewport?.offsetLeft ?? 0)}px`);
    }
    if (Number.isFinite(cy)) {
      root.style.setProperty('--switch-cy', `${cy + (viewport?.offsetTop ?? 0)}px`);
    }

    const main = document.querySelector('main');
    if (main) {
      const rect = main.getBoundingClientRect();
      const viewportWidth = viewport?.width ?? window.innerWidth;
      const viewportHeight = viewport?.height ?? window.innerHeight;
      const overscanX = Math.max(0, (rect.width - viewportWidth) / 2);
      const overscanY = Math.max(0, (rect.height - viewportHeight) / 2);
      window.scrollTo({ left: overscanX, top: overscanY, behavior: 'auto' });
    }
  </script>
</body>
</html>
