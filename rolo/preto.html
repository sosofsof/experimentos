<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Preto — Experimentos</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overscroll-behavior: contain;
    }
    body {
      min-width: 100%;
      min-height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
    main {
      --overscan-x: 16vw;
      --overscan-y: 18vh;
      position: relative;
      width: calc(100vw + 2 * var(--overscan-x));
      height: calc(100vh + 2 * var(--overscan-y));
      min-width: 100%;
      min-height: 100%;
      background: #000;
    }
    .switch-filter-defs {
      position: fixed;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .final-switch {
      position: absolute;
      left: calc(var(--overscan-x) + var(--switch-cx, 50vw));
      top: calc(var(--overscan-y) + var(--switch-cy, 50vh));
      transform: translate(-50%, -50%);
      width: min(320px, 73.6vw, 67.2svh);
      aspect-ratio: 1290 / 1650;
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .final-switch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: url("#switch-deep-red");
    }
    .final-switch .switch-key {
      position: absolute;
      inset: 0;
      transform: scaleY(-1);
      transform-origin: 50% 44.15152%;
    }
  </style>
</head>
<body>
  <svg class="switch-filter-defs" aria-hidden="true" width="0" height="0">
    <filter id="switch-deep-red" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncA type="gamma" amplitude="1" exponent=".08" offset=".12"/>
      </feComponentTransfer>
      <feColorMatrix type="matrix" values="
        0 0 0 0 .68
        0 0 0 0 .025
        0 0 0 0 .055
        0 0 0 1 0"/>
    </filter>
  </svg>
  <main aria-label="Tela preta com o interruptor desligado">
    <div class="final-switch" aria-hidden="true">
      <img src="./assets/interruptor-moldura.svg" width="1290" height="1650" alt="" draggable="false">
      <img class="switch-key" src="./assets/interruptor-tecla.svg" width="1290" height="1650" alt="" draggable="false">
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cx = Number(params.get('cx'));
    const cy = Number(params.get('cy'));
    const root = document.documentElement;
    if (Number.isFinite(cx)) root.style.setProperty('--switch-cx', `${cx}px`);
    if (Number.isFinite(cy)) root.style.setProperty('--switch-cy', `${cy}px`);

    requestAnimationFrame(() => {
      const main = document.querySelector('main');
      if (!main) return;
      const styles = getComputedStyle(main);
      const overscanX = parseFloat(styles.getPropertyValue('--overscan-x')) || 0;
      const overscanY = parseFloat(styles.getPropertyValue('--overscan-y')) || 0;
      window.scrollTo({ left: overscanX, top: overscanY, behavior: 'auto' });
    });
  </script>
</body>
</html>
