<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Preto — Experimentos</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .switch-filter-defs {
      position: fixed;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .final-switch {
      position: absolute;
      left: var(--switch-x, 50%);
      top: var(--switch-y, 50%);
      transform: translate(-50%, -50%);
      width: min(320px, 73.6vw, 67.2svh);
      aspect-ratio: 1290 / 1650;
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .final-switch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: url("#switch-deep-red");
    }
    .final-switch .switch-key {
      position: absolute;
      inset: 0;
      transform: scaleY(-1);
      transform-origin: 50% 44.15152%;
    }
  </style>
</head>
<body>
  <svg class="switch-filter-defs" aria-hidden="true" width="0" height="0">
    <filter id="switch-deep-red" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncA type="gamma" amplitude="1" exponent=".16" offset="0"/>
      </feComponentTransfer>
      <feColorMatrix type="matrix" values="
        0 0 0 0 .58
        0 0 0 0 .045
        0 0 0 0 .105
        0 0 0 1 0"/>
    </filter>
  </svg>
  <main aria-label="Tela preta com o interruptor desligado">
    <div class="final-switch" aria-hidden="true">
      <img src="./assets/interruptor-moldura.svg" width="1290" height="1650" alt="" draggable="false">
      <img class="switch-key" src="./assets/interruptor-tecla.svg" width="1290" height="1650" alt="" draggable="false">
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const x = Number(params.get('x'));
    const y = Number(params.get('y'));
    const root = document.documentElement;
    if (Number.isFinite(x) && x >= 0 && x <= 1) root.style.setProperty('--switch-x', `${x * 100}%`);
    if (Number.isFinite(y) && y >= 0 && y <= 1) root.style.setProperty('--switch-y', `${y * 100}%`);
  </script>
</body>
</html>
