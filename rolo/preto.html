<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Preto — Experimentos</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    body {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .final-switch {
      position: absolute;
      left: var(--switch-x, 50%);
      top: var(--switch-y, 50%);
      transform: translate(-50%, -50%);
      width: min(400px, 92vw, 84svh);
      aspect-ratio: 1290 / 1650;
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
    }
    .final-switch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 1;
      filter: none;
    }
    .final-switch .switch-key {
      position: absolute;
      inset: 0;
      transform: scaleY(-1);
      transform-origin: 50% 44.15152%;
    }
  </style>
</head>
<body>
  <main aria-label="Tela preta com o interruptor desligado">
    <div class="final-switch" aria-hidden="true">
      <img src="./assets/interruptor-moldura.svg" width="1290" height="1650" alt="" draggable="false">
      <img class="switch-key" src="./assets/interruptor-tecla.svg" width="1290" height="1650" alt="" draggable="false">
    </div>
  </main>
  <script>
    (() => {
      let position = null;
      try {
        position = JSON.parse(sessionStorage.getItem('rolo-final-switch-position') || 'null');
      } catch {
        position = null;
      }
      if (!position || !Number.isFinite(position.x) || !Number.isFinite(position.y)) return;

      const placeSwitch = () => {
        document.documentElement.style.setProperty('--switch-x', `${position.x * window.innerWidth}px`);
        document.documentElement.style.setProperty('--switch-y', `${position.y * window.innerHeight}px`);
      };
      placeSwitch();
      window.addEventListener('resize', placeSwitch, { passive: true });
    })();
  </script>
</body>
</html>
