<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Três flores que mudam entre vivas, mortas e cinzas usando um sol e um fósforo arrastáveis."
    />
    <title>Flores</title>
    <link rel="stylesheet" href="../assets/typography.css" />

    <link rel="stylesheet" href="../assets/navigation.css" />
    <script src="../assets/navigation.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="page-flores">
    <nav class="site-navigation" aria-label="Navegação da página">
      <a class="site-navigation__link" href="../index.html" data-site-back
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="m10 5-7 7 7 7M3 12h18" /></svg
        >Voltar</a
      >
      <a class="site-navigation__link" href="../index.html" aria-label="Voltar à página inicial"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z" /></svg
        >Página inicial</a
      >
    </nav>

    <main class="installation" aria-labelledby="page-title">
      <h1 id="page-title" class="installation-title">calor demais faz queimar</h1>
      <p id="instructions" class="sr-only">
        Arraste o sol sobre uma flor morta para fazê-la viver. Se o sol for usado três vezes sobre
        uma flor viva, ela morre. O fósforo mata uma flor viva e transforma uma flor morta em
        cinzas.
      </p>

      <div class="flowers" role="group" aria-label="Três flores" aria-describedby="instructions">
        <div
          class="flower"
          data-flower="cravo"
          data-name="Cravo"
          role="img"
          aria-label="Cravo vivo"
        >
          <img
            class="flower__alive"
            src="./assets/cravo-vivo.png"
            style="
              --image-height: 103.111111%;
              --image-bottom: -1.555556%;
              --stem-offset: -50.872818%;
            "
            width="401"
            height="928"
            alt=""
            aria-hidden="true"
            draggable="false"
            decoding="async"
          />
          <img
            class="flower__dead"
            src="./assets/cravo-morto.png"
            style="
              --image-height: 103.013994%;
              --image-bottom: -1.506997%;
              --stem-offset: -67.169811%;
            "
            width="265"
            height="957"
            alt=""
            aria-hidden="true"
            draggable="false"
            decoding="async"
          />
        </div>
        <div
          class="flower"
          data-flower="rosa"
          data-name="Rosa clara"
          role="img"
          aria-label="Rosa clara viva"
        >
          <img
            class="flower__alive"
            src="./assets/rosa-viva.png"
            style="
              --image-height: 103.594352%;
              --image-bottom: -1.797176%;
              --stem-offset: -76.38191%;
            "
            width="597"
            height="807"
            alt=""
            aria-hidden="true"
            draggable="false"
            decoding="async"
          />
          <img
            class="flower__dead"
            src="./assets/rosa-morta.png"
            style="
              --image-height: 103.825137%;
              --image-bottom: -1.912568%;
              --stem-offset: -89.577465%;
            "
            width="355"
            height="760"
            alt=""
            aria-hidden="true"
            draggable="false"
            decoding="async"
          />
        </div>
        <div
          class="flower"
          data-flower="rosa-vinho"
          data-name="Rosa vinho"
          role="img"
          aria-label="Rosa vinho viva"
        >
          <img
            class="flower__alive"
            src="./assets/rosa-vinho-viva.png"
            style="
              --image-height: 103.473945%;
              --image-bottom: -1.736973%;
              --stem-offset: -49.796748%;
            "
            width="492"
            height="834"
            alt=""
            aria-hidden="true"
            draggable="false"
            decoding="async"
          />
          <img
            class="flower__dead"
            src="./assets/rosa-vinho-morta.png"
            style="
              --image-height: 103.149606%;
              --image-bottom: -1.574803%;
              --stem-offset: -39.160839%;
            "
            width="429"
            height="917"
            alt=""
            aria-hidden="true"
            draggable="false"
            decoding="async"
          />
        </div>
      </div>

      <div class="tools" aria-label="Ferramentas">
        <button
          class="drag-tool drag-tool--sun"
          type="button"
          data-action="sun"
          aria-label="Sol: revive uma flor morta; três usos sobre uma flor viva fazem a flor morrer."
        >
          <img src="./assets/sol.png" alt="" aria-hidden="true" draggable="false" />
        </button>

        <button
          class="drag-tool drag-tool--match"
          type="button"
          data-action="match"
          aria-label="Fósforo aceso: mata uma flor viva e transforma uma flor morta em cinzas."
        >
          <img src="./assets/fosforo.png" alt="" aria-hidden="true" draggable="false" />
        </button>
      </div>

      <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>

    <script src="./flores.js" defer></script>
  </body>
</html>
