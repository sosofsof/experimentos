<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Dezoito cartas para descobrir, uma de cada vez.">
    <title>Cartas de tarô</title>
<link rel="stylesheet" href="../assets/typography.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="table">
      <h1 class="sr-only">Cartas de tarô</h1>
      <div id="cards" class="cards" role="group" aria-label="Escolha uma das dezoito cartas"></div>
      <noscript>Ative o JavaScript no navegador para escolher e abrir as cartas.</noscript>
    </main>

    <section id="viewer" class="viewer" aria-label="Carta e bordado oração" hidden>
      <button id="close-viewer" class="viewer-close" type="button" aria-label="Fechar">✕</button>
      <canvas id="prayer-image" class="prayer-image" role="img" aria-label="Bordado oração: Aberta" hidden></canvas>
    </section>
    <script src="./oracao.js" defer></script>
    <script src="./cartas.js" defer></script>
  </body>
</html>
