name: Instalar retalhos aprovados uma vez

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: contains(github.event.head_commit.message, '[install-exact-retalhos]')
    runs-on: ubuntu-24.04
    steps:
      - name: Obter repositório
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Reproduzir exatamente os quatro PNGs aprovados
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, hashlib, json, re, zlib

          targets = {
              "IMG_2972_retalho_05": {
                  "mask_file": ".tmp-retalho-mask-05.b64",
                  "rgba_sha256": "f5844d69072e1e744d3112cc0f4e02f5458f31a420b4cbc1c84a3bddb289b28a",
              },
              "IMG_2972_retalho_10": {
                  "mask_file": ".tmp-retalho-mask-10.b64",
                  "rgba_sha256": "7d9a4fffc6500e0113aec54384846daf8135d35fa9c76e48c34a41a5a7c7a2cd",
              },
              "IMG_2972_retalho_11": {
                  "mask_file": ".tmp-retalho-mask-11.b64",
                  "rgba_sha256": "cb2bc3e8b165ba895f23862ce76fbfe14425e46e1497b8940f780458d22b86e2",
              },
              "IMG_2972_retalho_12": {
                  "mask_file": ".tmp-retalho-mask-12.b64",
                  "rgba_sha256": "78996eebe4f5cdb2fb1268e52ac40fba72d0ba3d6eba2ace0ad48329722c199f",
              },
          }

          out_dir = Path("pecas/assets/v8")
          out_dir.mkdir(parents=True, exist_ok=True)

          def decode_ranges(path):
              data = base64.b64decode(Path(path).read_text(encoding="utf-8").strip())
              return json.loads(zlib.decompress(data).decode("utf-8"))

          def make_catalog_mask(im):
              w, h = im.size
              if h >= w:
                  mh = 96
                  mw = max(1, round(w / h * 96))
              else:
                  mw = 96
                  mh = max(1, round(h / w * 96))
              alpha = im.getchannel("A").resize((mw, mh), Image.Resampling.LANCZOS)
              bits = [1 if a > 16 else 0 for a in alpha.getdata()]
              packed = bytearray((len(bits) + 7) // 8)
              for i, bit in enumerate(bits):
                  if bit:
                      packed[i >> 3] |= 1 << (i & 7)
              return mw, mh, base64.b64encode(bytes(packed)).decode("ascii")

          catalog_masks = {}
          for stem, cfg in targets.items():
              src = Path("pecas/assets/v7") / f"{stem}.webp"
              im = Image.open(src).convert("RGBA")
              rgba = bytearray(im.tobytes())
              pixels = im.width * im.height

              for start, length in decode_ranges(cfg["mask_file"]):
                  end = start + length
                  if start < 0 or end > pixels:
                      raise SystemExit(f"Máscara inválida para {stem}: {start}:{end}")
                  for i in range(start, end):
                      off = i * 4
                      rgba[off:off+4] = b"\x00\x00\x00\x00"

              clean = Image.frombytes("RGBA", im.size, bytes(rgba))
              digest = hashlib.sha256(clean.tobytes()).hexdigest()
              if digest != cfg["rgba_sha256"]:
                  raise SystemExit(f"RGBA de {stem} não bate com o PNG aprovado: {digest}")

              out = out_dir / f"{stem}.webp"
              clean.save(out, "WEBP", lossless=True, quality=100, method=6, exact=True)
              check = Image.open(out).convert("RGBA")
              if check.size != im.size:
                  raise SystemExit(f"Resolução alterada em {stem}: {im.size} -> {check.size}")
              digest2 = hashlib.sha256(check.tobytes()).hexdigest()
              if digest2 != cfg["rgba_sha256"]:
                  raise SystemExit(f"WebP final de {stem} não preservou os pixels aprovados")

              mw, mh, mask = make_catalog_mask(check)
              catalog_masks[stem] = (mw, mh, mask)
              print(stem, im.size, digest2)

          catalog_path = Path("pecas/assets/v2/catalog.js")
          text = catalog_path.read_text(encoding="utf-8")
          prefix = "window.ARTWORK_ASSETS="
          marker = ";\nwindow.ARTWORK_BACKGROUNDS="
          assets_json, backgrounds_json = text[len(prefix):].split(marker, 1)
          assets = json.loads(assets_json)

          found = set()
          for asset in assets:
              stem = asset.get("id")
              if stem not in targets:
                  continue
              found.add(stem)
              mw, mh, mask = catalog_masks[stem]
              asset["maskWidth"] = mw
              asset["maskHeight"] = mh
              asset["mask"] = mask
              asset["src"] = f"./assets/v8/{stem}.webp"

          if found != set(targets):
              raise SystemExit(f"Assets ausentes no catálogo: {set(targets) - found}")

          catalog_path.write_text(
              prefix + json.dumps(assets, ensure_ascii=False, separators=(",", ":")) + marker + backgrounds_json,
              encoding="utf-8",
          )

          rev = "20260930exact2"
          for html_path in [Path("pecas/index.html"), Path("pecas/galeria.html")]:
              html = html_path.read_text(encoding="utf-8")
              html = re.sub(r'catalog\.js\?v=[^"\']+', f'catalog.js?v={rev}', html)
              html = re.sub(r'galeria\.html\?rev=[^"\']+', f'galeria.html?rev={rev}', html)
              html_path.write_text(html, encoding="utf-8")

          api_path = Path("pecas/src/api.ts")
          api = api_path.read_text(encoding="utf-8")
          api = re.sub(r"url\.searchParams\.set\('rev', '[^']+'\)", f"url.searchParams.set('rev', '{rev}')", api)
          api_path.write_text(api, encoding="utf-8")

          pub_path = Path("pecas/src/publication.ts")
          pub = pub_path.read_text(encoding="utf-8")
          pub = re.sub(r"galeria\.html\?rev=[^']+", f"galeria.html?rev={rev}", pub)
          pub_path.write_text(pub, encoding="utf-8")

          headers_path = Path("scripts/static-headers")
          headers = headers_path.read_text(encoding="utf-8")
          headers = re.sub(
              r"\n/pecas/assets/v7/\*\n  Cache-Control: public, max-age=31536000, immutable\n?",
              "\n",
              headers,
          )
          if "/pecas/assets/v8/*" not in headers:
              headers = headers.rstrip() + "\n\n/pecas/assets/v8/*\n  Cache-Control: public, max-age=31536000, immutable\n"
          headers_path.write_text(headers, encoding="utf-8")
          PY

      - name: Remover versões antigas e arquivos temporários
        shell: bash
        run: |
          set -euo pipefail
          rm -f pecas/assets/v7/IMG_2972_retalho_05.webp
          rm -f pecas/assets/v7/IMG_2972_retalho_10.webp
          rm -f pecas/assets/v7/IMG_2972_retalho_11.webp
          rm -f pecas/assets/v7/IMG_2972_retalho_12.webp
          rm -f .tmp-retalho-mask-05.b64 .tmp-retalho-mask-10.b64 .tmp-retalho-mask-11.b64 .tmp-retalho-mask-12.b64
          rm -f .github/workflows/install-exact-retalhos.yml

      - name: Validar projeto
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check:safety
          npm run check:secrets
          npm run check
          git diff --check

      - name: Gravar substituição exata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Instalo os quatro retalhos aprovados pixel a pixel"
          git push origin HEAD:main
