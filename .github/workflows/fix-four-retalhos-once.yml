name: Corrigir quatro retalhos uma vez

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-retalhos]')
    runs-on: ubuntu-24.04
    steps:
      - name: Obter repositório
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Limpar somente os quatro retalhos e atualizar máscaras
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          import base64, json, re

          targets = {
              "IMG_2972_retalho_05": "Retalho 26",
              "IMG_2972_retalho_10": "Retalho 31",
              "IMG_2972_retalho_11": "Retalho 32",
              "IMG_2972_retalho_12": "Retalho 33",
          }

          def largest_component(mask):
              px = mask.load()
              w, h = mask.size
              seen = bytearray(w * h)
              best = []
              for y in range(h):
                  for x in range(w):
                      idx = y * w + x
                      if seen[idx] or px[x, y] == 0:
                          continue
                      stack = [(x, y)]
                      seen[idx] = 1
                      comp = []
                      while stack:
                          xx, yy = stack.pop()
                          comp.append((xx, yy))
                          for dy in (-1, 0, 1):
                              for dx in (-1, 0, 1):
                                  if dx == 0 and dy == 0:
                                      continue
                                  nx, ny = xx + dx, yy + dy
                                  if 0 <= nx < w and 0 <= ny < h:
                                      ni = ny * w + nx
                                      if not seen[ni] and px[nx, ny] != 0:
                                          seen[ni] = 1
                                          stack.append((nx, ny))
                      if len(comp) > len(best):
                          best = comp
              out = Image.new("L", mask.size, 0)
              opx = out.load()
              for x, y in best:
                  opx[x, y] = 255
              return out

          def clean_asset(path):
              im = Image.open(path).convert("RGBA")
              original_size = im.size
              alpha = im.getchannel("A")
              binary = alpha.point(lambda a: 255 if a > 8 else 0)
              eroded = binary.filter(ImageFilter.MinFilter(5))
              core = largest_component(eroded)
              keep = core.filter(ImageFilter.MaxFilter(11))

              rgba = bytearray(im.tobytes())
              alpha_bytes = alpha.tobytes()
              keep_bytes = keep.tobytes()
              for i, (a, k) in enumerate(zip(alpha_bytes, keep_bytes)):
                  if k == 0:
                      off = i * 4
                      rgba[off:off+4] = b"\x00\x00\x00\x00"
              out = Image.frombytes("RGBA", original_size, bytes(rgba))
              out.save(path, "WEBP", lossless=True, quality=100, method=6, exact=True)

              check = Image.open(path).convert("RGBA")
              if check.size != original_size:
                  raise SystemExit(f"Resolução alterada em {path}: {original_size} -> {check.size}")
              return check

          def make_mask(im):
              w, h = im.size
              if h >= w:
                  mh = 96
                  mw = max(1, round(w / h * 96))
              else:
                  mw = 96
                  mh = max(1, round(h / w * 96))
              alpha = im.getchannel("A").resize((mw, mh), Image.Resampling.LANCZOS)
              bits = [1 if a > 16 else 0 for a in alpha.getdata()]
              packed = bytearray((len(bits) + 7) // 8)
              for i, bit in enumerate(bits):
                  if bit:
                      packed[i >> 3] |= 1 << (i & 7)
              return mw, mh, base64.b64encode(bytes(packed)).decode("ascii")

          masks = {}
          for stem, label in targets.items():
              path = Path("pecas/assets/v2") / f"{stem}.webp"
              before = Image.open(path).size
              cleaned = clean_asset(path)
              mw, mh, encoded = make_mask(cleaned)
              masks[stem] = (mw, mh, encoded)
              print(f"{label}: {before[0]}x{before[1]} preservado")

          catalog_path = Path("pecas/assets/v2/catalog.js")
          text = catalog_path.read_text(encoding="utf-8")
          prefix = "window.ARTWORK_ASSETS="
          marker = ";\nwindow.ARTWORK_BACKGROUNDS="
          if not text.startswith(prefix) or marker not in text:
              raise SystemExit("Formato inesperado do catalog.js")
          assets_json, backgrounds_json = text[len(prefix):].split(marker, 1)
          assets = json.loads(assets_json)

          found = set()
          for asset in assets:
              stem = asset.get("id")
              if stem in targets:
                  found.add(stem)
                  mw, mh, encoded = masks[stem]
                  asset["maskWidth"] = mw
                  asset["maskHeight"] = mh
                  asset["mask"] = encoded
                  asset["src"] = f"./assets/v2/{stem}.webp?v=20260930clean"
          if found != set(targets):
              raise SystemExit(f"Assets ausentes no catálogo: {set(targets) - found}")

          new_text = prefix + json.dumps(assets, ensure_ascii=False, separators=(",", ":")) + marker + backgrounds_json
          catalog_path.write_text(new_text, encoding="utf-8")

          for html_path in [Path("pecas/index.html"), Path("pecas/galeria.html")]:
              html = html_path.read_text(encoding="utf-8")
              html = re.sub(r'catalog\.js\?v=[^"\']+', 'catalog.js?v=20260930clean', html)
              html_path.write_text(html, encoding="utf-8")
          PY
      - name: Conferir somente os arquivos esperados
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --short)"
      - name: Gravar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             pecas/assets/v2/IMG_2972_retalho_05.webp             pecas/assets/v2/IMG_2972_retalho_10.webp             pecas/assets/v2/IMG_2972_retalho_11.webp             pecas/assets/v2/IMG_2972_retalho_12.webp             pecas/assets/v2/catalog.js             pecas/index.html             pecas/galeria.html
          git commit -m "Corrige resíduos nos quatro retalhos"
          git push origin HEAD:main
