name: Apply requested site fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source files and apply fixes
        run: |
          curl -L --fail "$(cat import-url.txt)" -o /tmp/site.zip
          unzip -p /tmp/site.zip 'site-experimentos/pecas/index.html' > pecas/index.html
          unzip -p /tmp/site.zip 'site-experimentos/rolo/index.html' > rolo/index.html
          python - <<'PY'
          from pathlib import Path

          p = Path('pecas/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("const used=placed.some(p=>p.asset.id===a.id);b.classList.toggle('used',used);b.disabled=used;b.setAttribute('aria-label',`${a.label}${used?' — já está na composição':''}`);",
               "b.setAttribute('aria-label',`${a.label} — arraste para adicionar quantas vezes quiser`);"),
              ("b.addEventListener('click',e=>{if(e.detail===0&&!used)add(a,W/2,H/2);});",
               "b.addEventListener('click',e=>{if(e.detail===0)add(a,W/2,H/2);});"),
              ("function add(a,x,y){if(placed.some(p=>p.asset.id===a.id))return;",
               "function add(a,x,y){"),
              ("keep(p,x,y);refresh();draw();status.textContent=`${a.label} adicionada.`;",
               "keep(p,x,y);draw();status.textContent=`${a.label} adicionada. Você pode usar este elemento novamente pela barra lateral.`;")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected Peças Livres pattern not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          r = Path('rolo/index.html')
          t = r.read_text(encoding='utf-8')
          marker = '<style id="lace-under-cord-v23">'
          if marker not in t:
              css = '''\n\n<style id="lace-under-cord-v23">\n  /* Keep the final lace piece centered on the exact vertical cord axis. */\n  .vertical-installation .scene-lace {\n    position: relative !important;\n    display: block !important;\n  }\n  .vertical-installation .scene-lace .lace-art {\n    position: absolute !important;\n    left: var(--branch-x, 50%) !important;\n    top: 50% !important;\n    right: auto !important;\n    margin: 0 !important;\n    transform: translate(-50%, -50%) !important;\n  }\n  @media (min-width: 901px) and (pointer: fine) {\n    .vertical-installation .scene-lace .lace-art {\n      transform: translate(-50%, -57%) !important;\n    }\n  }\n</style>\n'''
              if '</body>' not in t:
                  raise SystemExit('Expected </body> not found in Rolo')
              t = t.replace('</body>', css + '\n</body>', 1)
          r.write_text(t, encoding='utf-8')
          PY
          rm -f import-url.txt .github/workflows/apply-site-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix roll alignment and allow reusable free pieces'
          git push
